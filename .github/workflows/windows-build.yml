name: Nova Windows Build

# Full Windows build on a GitHub-hosted windows-latest runner:
# engine + BrowserHost + CLI (dotnet), Flutter desktop UI, browser extensions,
# and the Inno Setup installer. Artifacts are uploaded for download; pushing a
# tag v* also creates a GitHub Release with the installer attached.
#
# One-time setup: create an empty GitHub repository, push this repo's source
# (git remote add origin <url> && git push -u origin main), then run this
# workflow from the Actions tab — no other configuration required.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  audit:
    name: Version audit (version.json SSOT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: sync_versions --check (all surfaces must match version.json)
        run: python3 scripts/sync_versions.py --check

  windows:
    needs: audit
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Flutter (pinned 3.47.7)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          dotnet --version
          flutter --version
          flutter doctor

      # ---------------------------------------------------------------- engine
      - name: Build engine (win-x64 self-contained)
        run: |
          dotnet publish src/Nova.EngineHost -c Release -r win-x64 --self-contained -o publish/win-x64/engine
          dotnet publish src/Nova.BrowserHost -c Release -r win-x64 --self-contained -o publish/win-x64/browserhost
          dotnet publish src/Nova.Cli -c Release -r win-x64 --self-contained -o publish/win-x64/cli
          Get-ChildItem publish/win-x64 -Recurse -Filter *.pdb | Remove-Item

      # ---------------------------------------------------------------- engine tests (same OS as the target!)
      # T-026 (CI diagnosis round): --blame-hang names+aborts a hanging test
      # instead of eating the whole job budget; NOVA_TEST_TIMEOUT_SCALE gives
      # slow windows runners headroom; timeout dumps include per-task engine
      # diagnostics (state/error/retries) from the test Wait helpers.
      - name: Engine test suite
        env:
          NOVA_TEST_TIMEOUT_SCALE: '3'
        run: >
          dotnet test Nova.sln
          --filter "FullyQualifiedName!~BrowserPathTests"
          --blame-hang --blame-hang-timeout 20m --blame-hang-dump-type mini
          --logger "console;verbosity=normal"

      # ---------------------------------------------------------------- UI
      - name: Build Flutter Windows UI
        working-directory: apps/nova_desktop
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build windows --release

      # ---------------------------------------------------------------- extensions
      - name: Setup Node + build extensions
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install
          npm run build -- --zip
        working-directory: extensions

      # ---------------------------------------------------------------- installer
      - name: Setup Inno Setup
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Assemble installer payload
        shell: pwsh
        run: |
          # Layout contract from scripts/build-release.ps1 (installer\payload\*)
          $p = 'installer\payload'
          New-Item -ItemType Directory -Force -Path "$p\app", "$p\engine", "$p\ext", "$p\hosts" | Out-Null
          # Flutter UI (compiled in the previous step)
          Copy-Item -Recurse -Force apps\nova_desktop\build\windows\x64\runner\Release\* "$p\app\"
          # Engine + browser host (self-contained win-x64)
          Copy-Item publish\win-x64\engine\* "$p\engine\" -Recurse
          Copy-Item publish\win-x64\browserhost\* "$p\engine\" -Recurse
          # Extensions: versioned zips (wildcards — version.json is the SSOT) + unpacked dist
          Copy-Item extensions\chromium\nova-chromium-*.zip "$p\ext\"
          Copy-Item extensions\firefox\nova-firefox-*.zip "$p\ext\"
          Copy-Item -Recurse -Force extensions\chromium\dist "$p\ext\chromium"
          Copy-Item -Recurse -Force extensions\firefox\dist "$p\ext\firefox"
          # Native messaging host manifests (path patched at install time)
          Copy-Item extensions\com.nova.downloadmanager.chromium.template.json "$p\hosts\com.nova.downloadmanager.chromium.json"
          Copy-Item extensions\com.nova.downloadmanager.firefox.template.json "$p\hosts\com.nova.downloadmanager.firefox.json"

      - name: Build installer (iscc)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\nova-installer.iss || iscc installer\nova-installer.iss

      - name: Locate installer output
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "NovaSetup*.exe" -Path . | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Recurse -Filter "*.exe" -Path dist, installer, Output | Where-Object { $_.Name -notmatch "^nova(\.exe|Engine|Browser)" } | Select-Object -First 1 }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "Nova installer: $($exe.FullName)"

      # ---------------------------------------------------------------- artifacts
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-windows-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Upload portable engine bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-windows-engine-bundle
          path: |
            publish/win-x64/engine
            publish/win-x64/browserhost
            publish/win-x64/cli
          if-no-files-found: error

      # ---------------------------------------------------------------- release on tags
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag --title "Nova $tag" --generate-notes `
            "${{ steps.installer.outputs.path }}" || echo "release create skipped (may already exist)"
