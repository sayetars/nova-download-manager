name: Windows Release Build

on:
  push:
    tags: ['v*']
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-engine:
    name: Build C# engine (win-x64 self-contained)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test engine
        working-directory: engine
        run: dotnet test Nova.sln -c Release

      - name: Publish engine (self-contained single file)
        working-directory: engine
        run: >
          dotnet publish src/Nova.Host/Nova.Host.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-engine-win-x64
          path: engine/publish/win-x64/nova-host.exe

  build-flutter:
    name: Build Flutter UI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Generate Windows runner
        working-directory: app
        run: flutter create --platforms=windows --org nova --project-name nova .

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Windows (MSIX + zip)
        working-directory: app
        run: flutter build windows --release

      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath nova-ui-win-x64.zip

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-ui-win-x64
          path: nova-ui-win-x64.zip

  package-release:
    name: Package full installer + release
    needs: [build-engine, build-flutter]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download engine
        uses: actions/download-artifact@v4
        with:
          name: nova-engine-win-x64
          path: bundle/engine

      - name: Download UI
        uses: actions/download-artifact@v4
        with:
          name: nova-ui-win-x64
          path: bundle

      - name: Assemble bundle
        shell: pwsh
        run: |
          Expand-Archive -Path bundle/nova-ui-win-x64.zip -DestinationPath bundle/app
          New-Item -ItemType Directory -Force bundle/app/tools | Out-Null
          Copy-Item bundle/engine/nova-host.exe bundle/app/tools/
          # extensions
          Compress-Archive -Path extensions/chrome -DestinationPath bundle/app/extensions/nova-chrome.zip
          Compress-Archive -Path extensions/firefox -DestinationPath bundle/app/extensions/nova-firefox.zip
          Copy-Item installer/* bundle/app/ -ErrorAction SilentlyContinue

      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress || exit /b 0
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer/nova.iss || exit /b 0

      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path bundle/app/* -DestinationPath NovaDownloadManager-Windows-x64.zip

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: NovaDownloadManager-Windows-x64
          path: NovaDownloadManager-Windows-x64.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NovaDownloadManager-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-selftest:
    name: Linux engine self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        working-directory: engine
        run: dotnet test Nova.sln -c Release
      - name: Integration check
        working-directory: engine/scripts/IntegrationCheck
        run: |
          dotnet run &
          sleep 1
          dotnet run || true
