name: nova
description: Nova Download Manager — Windows 11 professional download manager UI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  win32: ^5.5.4
  window_manager: ^0.4.2
  tray_manager: ^0.2.3
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  syncfusion_flutter_charts: ^26.2.10
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.9
  file_picker: ^8.1.2
  persian_datetime_picker: ^3.0.2
  jalali_date: ^0.0.1
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true
  generate: true

msix_config:
  display_name: Nova Download Manager
  publisher_display_name: Nova Software
  identity_name: Nova.DownloadManager
  msix_version: 1.0.0.0
  capabilities: internetClient, runFullTrust, appNotifications
